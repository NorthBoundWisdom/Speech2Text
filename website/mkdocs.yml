site_name: SonaFolio
site_description: Local-first podcast transcription and knowledge library for macOS, iOS, and Windows.
site_url: https://northboundwisdom.github.io/sonafolio/
repo_url: https://github.com/NorthBoundWisdom/sonafolio
repo_name: NorthBoundWisdom/sonafolio
docs_dir: docs
site_dir: ../build/website
strict: true
use_directory_urls: true
hooks:
  - hooks/build_metadata.py
theme:
  name: material
  language: en
  font: false
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search:
      lang: [en]
extra_css:
  - stylesheets/sonafolio.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Get started:
      - Download and install: install.md
      - Your first transcript: quick-start.md
  - Handbook:
      - Library and subscriptions: guides/library.md
      - Codex summaries: guides/agent-summary.md
      - CLI and automation: guides/cli.md
      - QA and repair: guides/quality.md
      - Privacy and data: guides/privacy.md
      - Common questions: faq.md
  - Project:
      - Branding and compatibility: naming.md
      - Development: development.md
