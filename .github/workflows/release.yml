name: Native release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build-only version (for example 0.9.0 or 0.9.0-rc.1); manual runs do not publish'
        required: true
        default: '0.9.0'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: python configs/ci_release.py metadata
  checks:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --constraint constraints/runtime.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python src/scripts/check_public_paths.py --scope worktree
      - run: python -m pytest
  qt:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
          - os: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
          - os: macos-26
            host: mac
            arch: clang_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - run: python -m pip install cmake ninja
      - name: Build Qt Linux ICU ABI dependency
        if: runner.os == 'Linux'
        run: python configs/ci_release.py icu
      - name: Install verified Windows Qt SDK
        if: runner.os == 'Windows'
        run: python configs/ci_release.py windows-sdk
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        if: runner.os != 'Windows'
        with:
          version: '6.12.0'
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          archives: qtbase qtdeclarative qtsvg qtshadertools
          cache: true
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Prepare exact vendor license/source materials
        shell: bash
        run: python configs/ci_release.py prepare --qt-prefix "$QT_ROOT_DIR"
      - name: Build, deploy, verify and package Qt client
        shell: bash
        run: python -u configs/ci_release.py qt --qt-prefix "$QT_ROOT_DIR"
      - name: Verify installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem build/release/*-Setup.exe | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'SonaFolio-installed'
          $process = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$install" -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "Installer failed: $($process.ExitCode)" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:ATOT_INSTALLED_EXE = "$install/bin/SonaFolioQt.exe"
          python -c "import os, subprocess; subprocess.run([os.environ['ATOT_INSTALLED_EXE'], '--smoke-quit', '--data-root', os.path.join(os.environ['RUNNER_TEMP'], 'atot-smoke')], check=True, timeout=45)"
          if ($LASTEXITCODE -ne 0) { throw 'Installed QML smoke check failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-${{ matrix.host }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
  swift:
    needs: metadata
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install hatchling
      - run: swift test --scratch-path ../build/swiftpm
        working-directory: app
      - run: python configs/ci_release.py swift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-mac
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: [metadata, checks, qt, swift]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build/release
          merge-multiple: true
      - name: Verify all four assets and create checksums
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python configs/ci_release.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
      - name: Publish tag release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          tag = os.environ['RELEASE_TAG']
          assets = sorted(str(path) for path in Path('build/release').iterdir() if path.is_file())
          command = ['gh','release','create',tag,'--verify-tag','--title',tag,'--notes-file','configs/installers/RELEASE_NOTES.md']
          if '-' in tag:
              command.append('--prerelease')
          subprocess.run(command + assets, check=True)
          PY
