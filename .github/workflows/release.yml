name: Native release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build-only version (for example 0.9.0 or 0.9.0-rc.1); manual runs do not publish'
        required: true
        default: '0.9.2'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: python configs/ci_release.py metadata
  checks:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --constraint constraints/runtime.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python src/scripts/check_public_paths.py --scope worktree
      - run: python configs/check_repository_language.py
      - run: python -m pytest
  qt:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
          - os: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
          - os: macos-26
            host: mac
            arch: clang_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - run: python -m pip install cmake ninja
      - name: Resolve pinned GeoControls sources
        run: |
          python configs/source_roots.py init-seeds --quiet
          python configs/source_roots.py materialize --quiet
      - name: Build Qt Linux ICU ABI dependency
        if: runner.os == 'Linux'
        run: python configs/ci_release.py icu
      - name: Install verified Windows Qt SDK
        if: runner.os == 'Windows'
        run: python configs/ci_release.py windows-sdk
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        if: runner.os != 'Windows'
        with:
          version: '6.12.0'
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          archives: qtbase qtdeclarative qtsvg qtshadertools
          cache: true
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Prepare exact vendor license/source materials
        shell: bash
        run: python configs/ci_release.py prepare --qt-prefix "$QT_ROOT_DIR"
      - name: Build, deploy, verify and package Qt client
        shell: bash
        run: python -u configs/ci_release.py qt --qt-prefix "$QT_ROOT_DIR"
      - name: Report QML interaction results
        if: always()
        run: python -c "from pathlib import Path; p = Path('build/ci-qt/qt-workspace-results.txt'); print(p.read_text(encoding='utf-8') if p.exists() else 'No QML test report was generated.')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-${{ matrix.host }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
  swift:
    needs: metadata
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install hatchling
      - run: swift test --scratch-path ../build/swiftpm
        working-directory: app
      - run: python configs/ci_release.py swift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-mac
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
  package-smoke:
    name: Clean package startup (${{ matrix.artifact }})
    needs: [qt, swift]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: qt-windows
            pattern: SonaFolioQt-*-Setup.exe
            client: qt
          - os: ubuntu-24.04
            artifact: qt-linux
            pattern: SonaFolioQt-*.AppImage
            client: qt
          - os: macos-26
            artifact: qt-mac
            pattern: SonaFolioQt-*.dmg
            client: qt
          - os: macos-26
            artifact: swift-mac
            pattern: SonaFolioSwift-*.dmg
            client: swift
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # A separate runner has no build, Qt SDK, compiler setup or source roots.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: configs/check_packaged_runtime.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Linux desktop runtime and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 libegl1 libgl1 libopengl0 \
            libfontconfig1 libfreetype6 libglib2.0-0t64 libdbus-1-3 libx11-6 \
            libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/downloaded-packages
      - name: Launch final installer payload on a fresh runner
        env:
          PACKAGE_PATTERN: ${{ matrix.pattern }}
          PACKAGE_CLIENT: ${{ matrix.client }}
        run: |
          command=(python configs/check_packaged_runtime.py
            --package-dir "$RUNNER_TEMP/downloaded-packages"
            --pattern "$PACKAGE_PATTERN" --client "$PACKAGE_CLIENT"
            --workdir "$RUNNER_TEMP/sonafolio-native-startup"
            --evidence-json "$RUNNER_TEMP/sonafolio-native-evidence/result.json"
            --source-sha "$GITHUB_SHA")
          if [[ "$RUNNER_OS" == Linux ]]; then
            command=(xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- "${command[@]}")
          fi
          "${command[@]}"
      - name: Upload startup evidence and loader logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-startup-${{ matrix.artifact }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sonafolio-native-evidence/*.json
            ${{ runner.temp }}/sonafolio-native-startup/*.log
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [metadata, checks, qt, swift, package-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build/release
          merge-multiple: true
      - name: Verify all four assets and create checksums
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python configs/ci_release.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
      - name: Publish tag release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          tag = os.environ['RELEASE_TAG']
          assets = sorted(str(path) for path in Path('build/release').iterdir() if path.is_file())
          command = ['gh','release','create',tag,'--verify-tag','--title',tag,'--notes-file','configs/installers/RELEASE_NOTES.md']
          if '-' in tag:
              command.append('--prerelease')
          subprocess.run(command + assets, check=True)
          PY
