name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --constraint constraints/runtime.txt -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python src/scripts/check_public_paths.py --scope worktree
      - run: python configs/check_repository_language.py
      - run: python src/scripts/validate_model_inventory.py
      - run: python -m pytest
