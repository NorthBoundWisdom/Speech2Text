[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "audio2text-local"
version = "0.1.0"
description = "Local long-form audio-to-text workflow for Chinese podcasts on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "AtoT" }
]
keywords = ["audio", "transcription", "whisper", "mlx", "apple-silicon", "chinese"]
dependencies = [
  "mlx-whisper>=0.4.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.1.0; platform_system == 'Windows'",
  "huggingface_hub[hf_xet]>=0.23.0",
  "feedparser>=6.0.11",
  "filelock>=3.13",
  "httpx>=0.27",
  "keyring>=25.0",
  "mcp>=2.3,<3",
  "msgpack>=1.2.1",
  "socksio>=1.0.0",
  "numpy>=1.26",
  "transformers>=4.41",
  "sentencepiece>=0.2",
  "rich>=13.7",
  "typer>=0.12",
  "textual>=0.86",
  "tomlkit>=0.13",
  "tomli>=2.0; python_version < '3.11'",
  "tzdata>=2025.2; platform_system == 'Windows'"
]

[project.scripts]
atot = "atot.cli:main"
Audio2TextCli = "atot.cli:main"

[project.optional-dependencies]
dev = [
  "hatchling>=1.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "ruff>=0.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/atot"]

[tool.hatch.build.targets.sdist]
# CLI source distributions must not traverse locally installed build dependencies.
include = [
  "/src/atot",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
  "/constraints/runtime.txt"
]

[tool.ruff]
line-length = 100
target-version = "py310"
cache-dir = "~/Documents/SpeechToTextData/cache/ruff"
extend-exclude = [
  "Downloads",
  "FreeCM",
  "build",
  "app/.build"
]

[tool.ruff.lint]
# Keep the established lint gate stable across Ruff default-rule changes.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["src/tests"]
pythonpath = ["src"]
cache_dir = "~/Documents/SpeechToTextData/cache/pytest"

[tool.coverage.run]
branch = true
source = ["atot"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = ["src/atot"]
strict = true
